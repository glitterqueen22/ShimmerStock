name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Secret scan (check:safety)
        run: node scripts/redact-secret-report.mjs --check

      - name: Gateway bypass check (check:safety)
        run: node scripts/check-gateway-bypass.mjs --check

      - name: Type check
        run: bun run typecheck
        timeout-minutes: 5

      - name: Build check
        run: bun run build

      - name: Run tests
        run: bun test
        env:
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
